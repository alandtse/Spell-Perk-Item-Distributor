name: VR Release

# Fork-specific VR DLL release. Upstream's main.yml ships the full SE/AE FOMOD
# and disables VR; this builds only the VR variant and attaches the raw
# DLL + PDB (7z) to a GitHub Release. Reuses the existing
# vs2022-windows-vcpkg-vr CMake preset.

on:
  push:
    tags:
    # Fork convention is 4-part (X.Y.Z.N) where N is the fork release counter,
    # e.g. 7.3.0.0. Upstream's 3-part tags are handled by main.yml instead.
    - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
    - '[0-9]+.[0-9]+.[0-9]+.[0-9]+.rc[0-9]+'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-vr:
    # Only run on the VR fork, never on upstream (powerof3).
    if: github.repository_owner == 'alandtse'
    runs-on: windows-2022

    env:
      ARCHIVE_NAME: po3_SpellPerkItemDistributor-VR-${{ github.ref_name }}.7z
      # vcpkg GitHub Actions binary cache (skips rebuilding deps on cache hit).
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
    - name: Checkout (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set VCPKG_ROOT
      shell: pwsh
      run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

    - name: Enable vcpkg GHA binary cache
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Configure (VR)
      run: cmake --preset vs2022-windows-vcpkg-vr

    - name: Build (VR Release)
      run: cmake --build --preset vs2022-windows-vcpkg-vr

    - name: Package DLL + PDB
      shell: pwsh
      run: |
        $out = "buildvr/SPID/Release"
        New-Item -ItemType Directory -Force -Path "stage/SKSE/Plugins" | Out-Null
        Copy-Item "$out/po3_SpellPerkItemDistributor.dll" "stage/SKSE/Plugins/"
        Copy-Item "$out/po3_SpellPerkItemDistributor.pdb" "stage/SKSE/Plugins/"
        7z a -t7z "$env:ARCHIVE_NAME" "./stage/*"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ARCHIVE_NAME }}
        fail_on_unmatched_files: true
        generate_release_notes: true
